id: B1_small_domain
title: "Artificial boundaries too close (12.5 % blockage)"
changes:
  domain.upstream: 8.0
  domain.downstream: 15.0
  domain.half_height: 4.0
flaw: "Inlet 8 D upstream, outlet 15 D downstream, free-slip sides 4 D from the axis (blockage 12.5 %)."
why_plausible: "Common in quick-start setups; near-field mesh identical to the baseline; runs cleanly."
expected_mechanism: "Blockage accelerates the flow past the cylinder; Cd and St biased high (Behr et al. 1995: ~+6 % at 11 % blockage)."

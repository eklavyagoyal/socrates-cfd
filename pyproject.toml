[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socrates-cfd"
version = "0.1.0"
description = "Research prototype: autonomous verification of CFD results (OpenFOAM, 2D cylinder at Re=100)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
socrates = "socrates.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not openfoam'"
markers = [
    "openfoam: requires an OpenFOAM installation (slow, runs real solver)",
]
